name: Deploy no Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Envia para o Space
        env:
          HF_USER: ${{ secrets.HF_USER }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'painel-fundos' }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USER" ]; then echo "Configure os secrets HF_USER e HF_TOKEN"; exit 1; fi
          git push --force "https://$HF_USER:$HF_TOKEN@huggingface.co/spaces/$HF_USER/$HF_SPACE" HEAD:main
